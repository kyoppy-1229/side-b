<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <title>SIDE-B</title>
    <meta name="robots" content="noindex" />
    <style>
      html,body{height:100%;margin:0;background:#0b0d12;color:#e8e8e8;font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif}
      main{display:grid;place-items:center;height:100%;text-align:center;font-size:13px;line-height:2}
      a{color:#7dc0ff}
    </style>
    <script>
      // GitHub Pages serves this file for any path it does not have a file for.
      // The app is a hash router, so `<base>/trial` — the address the trial is
      // published under — arrives here and is sent on to `<base>/#/trial`.
      // Anything else goes to the front door.
      (function(){
        var segments = location.pathname.split('/').filter(Boolean)
        var trial = segments[segments.length - 1] === 'trial'
        // Project pages live under /<repo>/; a user page has no repo segment.
        var repo = segments[0] && segments[0] !== 'trial' ? '/' + segments[0] + '/' : '/'
        location.replace(repo + (trial ? '#/trial' : '#/'))
      })()
    </script>
  </head>
  <body>
    <main>
      <p>
        読み込んでいます……<br />
        <a href="./#/">SIDE-B を開く</a> ／ <a href="./#/trial">体験版を開く</a>
      </p>
    </main>
  </body>
</html>
